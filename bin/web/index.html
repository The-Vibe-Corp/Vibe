<!doctype html>
<html lang="__VIBE_LANG__" data-theme="light" data-animations="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="vibe-opencode-url" content="__OPENCODE_URL__">
<meta name="vibe-language" content="__VIBE_LANG__">
<title>vibe</title>
<link rel="stylesheet" href="/static/nova.css">
<link rel="icon" href="/static/vibe.svg" type="image/svg+xml">
</head>
<body data-nv-app>
<!-- Texte/aria-labels der Shell kommen aus tr() in initChrome(); das Markup
     bleibt sprachneutral, damit zuerst die gewählte Sprache sichtbar wird. -->
<a class="nv-skip" href="#nv-main"></a>
<header class="nv-top">
<img class="nv-logo" data-nv-logo src="/static/vibe.svg" alt="vibe">
<button type="button" class="nv-nav-toggle" data-nv-nav-toggle aria-expanded="false" aria-label="" title="">☰</button>
<nav class="nv-nav" data-nv-navs aria-label="Navigation">
<button type="button" data-nv-nav="home"></button>
<button type="button" data-nv-nav="agents"></button>
<button type="button" data-nv-nav="activity"></button>
<button type="button" data-nv-nav="evaluations"></button>
<button type="button" data-nv-nav="settings"></button>
</nav>
<div class="nv-nav-scrim" data-nv-nav-scrim aria-hidden="true"></div>
<div class="nv-top-actions">
<label class="nv-anim-switch" aria-label="" title=""><input type="checkbox" data-nv-anim-toggle checked><span class="nv-anim-glyph" aria-hidden="true">✦</span></label>
<button type="button" class="nv-btn nv-ghost nv-icon-btn" data-nv-theme-toggle aria-label="" title=""></button>
<button type="button" class="nv-btn nv-ghost nv-questions-button" data-nv-questions-button aria-label="" title=""><span class="nv-questions-label"></span><span class="nv-badge" data-nv-questions-count hidden>0</span></button>
<div class="nv-bell-wrap">
<button type="button" class="nv-btn nv-ghost nv-icon-btn" data-nv-bell aria-label="" title="">🔔<span class="nv-badge" data-nv-bell-count hidden>0</span></button>
<div class="nv-drawer" data-nv-bell-panel hidden></div>
</div>
</div>
</header>
<!-- F34: Rückfragen sind auf jeder Ansicht sichtbar; das Banner sitzt direkt
     unter der Kopfzeile und wird von NV.questions befüllt. -->
<div class="nv-question-banner" data-nv-question-banner hidden></div>
<!-- F34: Die statische Sidebar-Navigation entfällt. Das leere Aside bleibt nur
     für Bestands-Hooks im DOM und enthält bewusst keine [data-nv-nav]-Knöpfe. -->
<aside class="nv-side" data-nv-side></aside>
<main id="nv-main" data-nv-view="home" class="nv-main"></main>
<div class="nv-context-scrim" data-nv-context-scrim hidden></div>
<aside class="nv-context" data-nv-context hidden>
<div class="nv-context-head">
<h2 data-nv-context-title></h2>
<button type="button" class="nv-btn nv-ghost nv-close" data-nv-context-close aria-label="" title="">×</button>
</div>
<div class="nv-context-body" data-nv-context-body></div>
<div class="nv-context-foot" data-nv-context-foot></div>
</aside>
<div id="nv-toasts" class="nv-toasts" aria-live="polite"></div>
<script src="/static/i18n.js"></script>
<script src="/static/nova-core.js"></script>
<script src="/static/nova-widgets.js"></script>
<script src="/static/nova-home.js"></script>
<script src="/static/nova-project.js"></script>
<script src="/static/nova-output.js"></script>
<script src="/static/nova-agents.js"></script>
<script src="/static/nova-activity.js"></script>
<script src="/static/nova-evals.js"></script>
<script src="/static/nova-settings.js"></script>
</body>
</html>
